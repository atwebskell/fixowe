<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site is Under Maintenance | Fixowe</title>
  <link rel="icon" type="image/png" href="/assets/favicon-optimized.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-red: #e11d48;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --bg-color: #ffffff;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      min-height: 100vh;
      width: 100%;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    .brand-logo {
      height: 52px;
      margin-bottom: 40px;
    }

    /* Traffic Cone Illustration */
    .cone-icon-box {
      width: 110px;
      height: 110px;
      margin-bottom: 28px;
      animation: floatCone 3s infinite ease-in-out;
    }

    @keyframes floatCone {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .title {
      font-size: 32px;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: 32px;
    }

    /* Social Icons Row */
    .social-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 40px;
    }

    .social-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dark);
      text-decoration: none;
      font-size: 16px;
      transition: all 0.25s ease;
    }

    .social-btn:hover {
      border-color: var(--primary-red);
      color: var(--primary-red);
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(225, 29, 72, 0.15);
    }

    /* Email Bar */
    .email-container {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .email-pill {
      display: inline-block;
      padding: 10px 24px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-weight: 600;
      color: var(--text-dark);
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .email-pill:hover {
      border-color: var(--primary-red);
      color: var(--primary-red);
    }
  </style>
</head>
<body>

  <a href="/index.html">
    <img src="/assets/transparent-logo-fixowe.png" alt="Fixowe Logo" class="brand-logo">
  </a>

  <div class="cone-icon-box">
    <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M15 100L105 100C108 100 110 98 109 95L95 75L25 75L11 95C10 98 12 100 15 100Z" fill="#e11d48"/>
      <path d="M30 75L40 35L80 35L90 75L30 75Z" fill="#ffffff" stroke="#e11d48" stroke-width="4"/>
      <path d="M40 35L47 15C48 12 52 10 60 10C68 10 72 12 73 15L80 35L40 35Z" fill="#e11d48"/>
      <path d="M35 55L85 55" stroke="#e11d48" stroke-width="6"/>
    </svg>
  </div>

  <h1 class="title">Site is Under maintenance</h1>
  <p class="subtitle">You can still reach us at our social media accounts</p>

  <div class="social-row">
    <a href="https://facebook.com/share/1E5Wc2CTof/?mibextid=wwXlfr" class="social-btn" aria-label="Facebook" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
    <a href="https://www.instagram.com/ashfa4k/?utm_source=ig_web_button_share_sheet" class="social-btn" aria-label="Instagram" target="_blank"><i class="fa-brands fa-instagram"></i></a>
    <a href="https://api.whatsapp.com/send?phone=916235780788" class="social-btn" aria-label="WhatsApp" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>
    <a href="tel:+916235780788" class="social-btn" aria-label="Phone"><i class="fa-solid fa-phone"></i></a>
  </div>

  <div class="email-container">
    <span>Send us an Email</span>
    <a href="mailto:info@fixowe.com" class="email-pill">info@fixowe.com</a>
  </div>

</body>
</html>
