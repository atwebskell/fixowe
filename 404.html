<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Fixowe</title>
  <link rel="icon" type="image/png" href="/assets/transparent-logo-fixowe.png">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body, html {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    
    .error-page-wrapper {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-image: url('/assets/hero_bg.png');
      background-size: cover;
      background-position: center;
    }

    .error-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(3, 17, 49, 0.95) 0%, rgba(7, 30, 84, 0.85) 100%);
      z-index: 1;
    }

    .error-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 40px;
      color: #fff;
      max-width: 700px;
      margin: 0 auto;
    }

    .logo-container {
      margin-bottom: 60px;
    }

    .logo-container img {
      height: 70px;
      filter: brightness(0) invert(1);
    }

    .error-code {
      font-size: 180px;
      font-weight: 900;
      line-height: 0.9;
      background: linear-gradient(180deg, #ffffff 0%, rgba(255, 255, 255, 0.3) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
      text-shadow: 0 20px 40px rgba(0,0,0,0.3);
      font-family: var(--font-primary, 'Inter', sans-serif);
      letter-spacing: -5px;
    }

    .error-title {
      font-size: 42px;
      font-weight: 800;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
      font-family: var(--font-primary, 'Inter', sans-serif);
    }

    .error-desc {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 50px;
      line-height: 1.6;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    .btn-return {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: var(--accent-green, #2ca84a);
      color: #fff;
      padding: 18px 46px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 20px rgba(44, 168, 74, 0.2);
    }

    .btn-return:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 30px rgba(44, 168, 74, 0.4);
      background: #238b3c;
    }

    .btn-return i {
      transition: transform 0.3s ease;
    }

    .btn-return:hover i {
      transform: translateX(-5px);
    }
  </style>
</head>
<body>

  <div class="error-page-wrapper">
    <div class="error-overlay"></div>
    
    <div class="error-content">
      <div class="logo-container">
        <a href="/index.html">
          <img src="/assets/transparent-logo-fixowe.png" alt="Fixowe Logo">
        </a>
      </div>

      <div class="error-code">404</div>
      <h2 class="error-title">Page Not Found</h2>
      <p class="error-desc">The page you are looking for has been moved, deleted, or never existed in the first place.</p>
      <a href="/index.html" class="btn-return">
        <i class="fa-solid fa-arrow-left"></i> Return Home
      </a>
    </div>
  </div>

</body>
</html>
