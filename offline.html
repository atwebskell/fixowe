<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No Internet Connection | Fixowe</title>
  <link rel="icon" type="image/png" href="/assets/favicon-optimized.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-red: #e11d48;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --bg-color: #ffffff;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      min-height: 100vh;
      width: 100%;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    .brand-logo {
      height: 52px;
      margin-bottom: 40px;
    }

    .icon-box {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: rgba(225, 29, 72, 0.08);
      color: var(--primary-red);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin-bottom: 28px;
      animation: pulseIcon 3s infinite ease-in-out;
    }

    @keyframes pulseIcon {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .title {
      font-size: 32px;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: 32px;
      max-width: 460px;
      line-height: 1.6;
    }

    .btn-retry {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--primary-red);
      color: #ffffff;
      padding: 16px 36px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      margin-bottom: 40px;
      transition: all 0.3s ease;
      box-shadow: 0 10px 25px rgba(225, 29, 72, 0.25);
    }

    .btn-retry:hover {
      background: #be123c;
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(225, 29, 72, 0.35);
    }

    /* Social Icons Row */
    .social-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 36px;
    }

    .social-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dark);
      text-decoration: none;
      font-size: 16px;
      transition: all 0.25s ease;
    }

    .social-btn:hover {
      border-color: var(--primary-red);
      color: var(--primary-red);
      transform: translateY(-2px);
    }

    .email-container {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .email-pill {
      display: inline-block;
      padding: 10px 24px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-weight: 600;
      color: var(--text-dark);
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .email-pill:hover {
      border-color: var(--primary-red);
      color: var(--primary-red);
    }
  </style>
</head>
<body>

  <a href="/index.html">
    <img src="/assets/transparent-logo-fixowe.png" alt="Fixowe Logo" class="brand-logo">
  </a>

  <div class="icon-box">
    <i class="fa-solid fa-wifi-slash"></i>
  </div>

  <h1 class="title">You are Offline</h1>
  <p class="subtitle">Please check your internet connection or mobile network settings.</p>

  <button class="btn-retry" onclick="checkConnection()">
    <i class="fa-solid fa-rotate-right" id="retryIcon"></i> Try Reconnecting
  </button>

  <div class="social-row">
    <a href="https://facebook.com/share/1E5Wc2CTof/?mibextid=wwXlfr" class="social-btn" aria-label="Facebook" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
    <a href="https://www.instagram.com/ashfa4k/?utm_source=ig_web_button_share_sheet" class="social-btn" aria-label="Instagram" target="_blank"><i class="fa-brands fa-instagram"></i></a>
    <a href="https://api.whatsapp.com/send?phone=916235780788" class="social-btn" aria-label="WhatsApp" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>
    <a href="tel:+916235780788" class="social-btn" aria-label="Phone"><i class="fa-solid fa-phone"></i></a>
  </div>

  <div class="email-container">
    <span>Send us an Email</span>
    <a href="mailto:info@fixowe.com" class="email-pill">info@fixowe.com</a>
  </div>

  <script>
    function checkConnection() {
      const icon = document.getElementById('retryIcon');
      icon.classList.add('fa-spin');
      setTimeout(() => {
        if (navigator.onLine) {
          window.location.reload();
        } else {
          icon.classList.remove('fa-spin');
          alert('Still offline. Please check your network connection.');
        }
      }, 1000);
    }
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>

</body>
</html>
